<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ważne dla responsywności! -->
    <title>Bilety - Orkiestra Sygnał</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <h1>Koncert - Orkiestra Dęta "Sygnał"</h1>
    <p>Wybierz wolne miejsca, aby dodać je do koszyka.</p>
    
    <!-- Wrapper umożliwiający przewijanie palcem na telefonie -->
    <div class="map-wrapper">
        <div class="map-container">
            <div class="stage">SCENA</div>
            <div id="seat-map"></div>
        </div>
    </div>

    <!-- Panel koszyka na dole -->
    <div id="koszyk-panel">
        <h2>Twój koszyk</h2>
        <div id="koszyk-lista">Brak wybranych miejsc.</div>
        <button id="btn-kup" class="kup" disabled onclick="kupBilety()">Zarezerwuj bilety</button>
    </div>

    <!-- Wyskakujące okienko formularza -->
    <div id="modal-rezerwacji" class="modal">
        <div class="modal-content">
            <span class="zamknij" onclick="zamknijModal()">&times;</span>
            <h2>Dane rezerwacji</h2>
            <p>Podaj swoje dane, abyśmy mogli przypisać do nich Twoje bilety.</p>
            <input type="text" id="klient-imie" placeholder="Imię i nazwisko" required>
            <input type="email" id="klient-email" placeholder="Adres e-mail" required>
            <!-- Nowe pole na telefon -->
            <input type="tel" id="klient-telefon" placeholder="Numer telefonu" required>
            <button class="kup" onclick="potwierdzRezerwacje()">Potwierdzam i rezerwuję</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
