<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ważne dla responsywności! -->
    <title>Bilety - Orkiestra Sygnał</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <h1>Koncert - Orkiestra Dęta "Sygnał"</h1>
    <p>Wybierz wolne miejsca, aby dodać je do koszyka.</p>
    
    <!-- Wrapper umożliwiający przewijanie palcem na telefonie -->
    <div class="map-wrapper">
        <div class="map-container">
            <div class="stage">SCENA</div>
            <div id="seat-map"></div>
        </div>
    </div>

    <!-- Panel koszyka na dole -->
    <div id="koszyk-panel">
        <h2>Twój koszyk</h2>
        <div id="koszyk-lista">Brak wybranych miejsc.</div>
        <button id="btn-kup" class="kup" disabled onclick="kupBilety()">Zarezerwuj bilety</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
